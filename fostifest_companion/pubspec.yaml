name: fostifest_companion
description: FOSTIFEST — aplikasi keuangan untuk pembukuan dan pengembangan UMKM.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/batik-store-avatar.jpg
    - assets/images/hero-store.jpg
